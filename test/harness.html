<!DOCTYPE html>
<!--
  Harness de teste local para as Custom Visualizations do Looker.

  O que este arquivo faz:
    - Simula o mínimo necessário do ambiente do Looker para carregar e
      testar os arquivos de /src sem precisar subir nada ao Looker real:
        window.looker.plugins.visualizations.add(definicao)
        window.LookerCharts.Utils.textForCell / openDrillMenu / ...
        this.addError(...) / this.clearErrors() / this.trigger(...)
    - Gera conjuntos de dados de exemplo: sem pivô, com pivô (com e sem o
      pivô de "total de linha" que o próprio Looker às vezes fornece),
      com valores nulos, com 20 linhas e com 5.000 linhas, além de conjuntos
      geográficos (campo único "lat,lon", campos separados de latitude/
      longitude, e um conjunto grande) para testar o Globo Terrestre, e
      conjuntos para o Mapa Customizável (30 cidades do mundo, 5.000 e
      20.000 pontos aleatórios, nulos, e pares origem-destino).
    - Carrega as mesmas Dependencies do Mapa Customizável (d3@7.9.0,
      d3-geo-projection@4.0.0, topojson-client@3.1.0, dados do mapa) antes
      dos arquivos de /src, na mesma ordem usada no Admin do Looker.
    - Opções registradas dinamicamente via this.trigger('registerOptions',...)
      (ex.: os seletores de campo do Globo) só aparecem no JSON de config
      depois de clicar em "Completar opções novas".
    - Deixa editar a configuração (equivalente ao painel "Edit" do Admin)
      como JSON simples, e mostra o tempo gasto em updateAsync.

  O que este harness NÃO simula (confira sempre no Looker real):
    - O editor visual de opções do Looker (aqui a config é só um JSON).
    - Drill real (clique em célula com link só mostra um alerta/console).
    - Diferenças de layout/CSS do tile do Looker (tamanho do tile real,
      fontes do tema da conta, modo escuro do Looker etc.).
    - Tipos de agregação de medidas (sum/average/...), que a API de
      visualização não expõe.
-->
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<title>Harness - Custom Visualizations Looker</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; margin: 0; padding: 16px; background: #f5f6f8; color: #111827; }
  h1 { font-size: 18px; margin: 0 0 12px; }
  .painel { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  .linha { display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 8px; }
  label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: #374151; }
  select, button, input[type=number] { font-size: 13px; padding: 6px 8px; border: 1px solid #d1d5db; border-radius: 6px; background: #fff; }
  button { cursor: pointer; background: #111827; color: #fff; border-color: #111827; }
  button:hover { opacity: 0.9; }
  textarea { width: 100%; min-height: 140px; font-family: Consolas, "Courier New", monospace; font-size: 12px; box-sizing: border-box; }
  #vizContainer { width: 100%; height: 70vh; border: 1px solid #d1d5db; border-radius: 8px; background: #fff; overflow: hidden; }
  #erros { white-space: pre-wrap; font-size: 12px; color: #b91c1c; }
  #status { font-size: 12px; color: #374151; margin-top: 6px; }
  .check { display: flex; align-items: center; gap: 6px; font-size: 13px; }
</style>
</head>
<body>

<h1>Harness local — Custom Visualizations do Looker</h1>

<div class="painel">
  <div class="linha">
    <div>
      <label for="vizSelect">Visualização (arquivo em /src)</label>
      <select id="vizSelect"></select>
    </div>
    <div>
      <label for="dataSelect">Conjunto de dados de exemplo</label>
      <select id="dataSelect">
        <option value="flat20">Sem pivô — 20 linhas (com nulos)</option>
        <option value="flat5000">Sem pivô — 5.000 linhas</option>
        <option value="pivot20">Com pivô — 20 linhas (com nulos)</option>
        <option value="pivot20total">Com pivô — 20 linhas + total de linha do Looker</option>
        <option value="pivot5000">Com pivô — 5.000 linhas</option>
        <option value="vazio">Sem dimensões nem medidas (teste de erro)</option>
        <option value="geoLocation">Globo — campo único de localização (lat,lon), 25 pontos</option>
        <option value="geoManual">Globo — campos separados de latitude/longitude, 25 pontos</option>
        <option value="geo2000">Globo — 2.000 pontos (teste de desempenho)</option>
        <option value="mapaCidades30">Mapa — 30 cidades do mundo (lat/lon separados)</option>
        <option value="mapaAleatorio5000">Mapa — 5.000 pontos aleatórios (com nulos)</option>
        <option value="mapaAleatorio20000">Mapa — 20.000 pontos aleatórios (teste de desempenho)</option>
        <option value="mapaOrigemDestino">Mapa — 200 pares origem-destino (para a etapa de linhas)</option>
      </select>
    </div>
    <div>
      <button id="btnRenderizar">Renderizar</button>
    </div>
    <div>
      <button id="btnOpcoesPadrao" title="Útil depois que a visualização registra opções dinâmicas por campo (registerOptions), como os seletores de campo do Globo">Completar opções novas</button>
    </div>
    <div id="status"></div>
  </div>
  <div class="linha" id="presetsMapa">
    <div>
      <label>Presets rápidos do Mapa Customizável (mesclam no JSON de config)</label>
      <div class="linha" style="margin-bottom:0;">
        <button data-preset="mercator">Mercator (padrão)</button>
        <button data-preset="orthographic">Orthographic (estática)</button>
        <button data-preset="kavrayskiy7">Kavrayskiy7</button>
        <button data-preset="albersUsa">Albers Usa</button>
        <button data-preset="identity">Cartesian (sem projeção)</button>
        <button data-preset="dark">Tema Dark</button>
        <button data-preset="satellite">Tema Satellite-like</button>
        <button data-preset="customBrasil">Custom centrado no Brasil</button>
        <button data-preset="semPanZoom">Sem pan nem zoom</button>
        <button data-preset="tooltipCustom">Tooltip customizado</button>
        <button data-preset="modoGlobo">Modo Globo (arrastar para girar)</button>
      </div>
    </div>
  </div>
  <div class="linha">
    <div style="flex:1;min-width:280px;">
      <label for="configArea">Config (equivalente às opções do painel Edit, em JSON)</label>
      <textarea id="configArea"></textarea>
    </div>
  </div>
  <div id="erros"></div>
</div>

<div id="vizContainer"></div>

<script>
// =======================================================================
// 1) Simulação mínima do ambiente global do Looker
// =======================================================================
var registroDeVisualizacoes = {};

window.looker = {
  plugins: {
    visualizations: {
      add: function (definicao) {
        registroDeVisualizacoes[definicao.id] = definicao;
      }
    }
  }
};

window.LookerCharts = {
  Utils: {
    // Nunca retorna null — igual à API real.
    textForCell: function (cell) {
      if (cell === undefined || cell === null) return '';
      if (cell.value === undefined || cell.value === null) return '∅';
      if (typeof cell.rendered === 'string') return cell.rendered;
      return String(cell.value);
    },
    htmlForCell: function (cell) {
      var texto = window.LookerCharts.Utils.textForCell(cell);
      return texto; // simplificado: harness não gera HTML de drill de verdade
    },
    filterableValueForCell: function (cell) {
      return cell && cell.value !== undefined ? String(cell.value) : '';
    },
    openDrillMenu: function (opts) {
      var links = (opts && opts.links) || [];
      var resumo = links.map(function (l) { return l.label + ' -> ' + l.url; }).join('\n');
      console.log('[harness] openDrillMenu chamado com', opts);
      window.alert('Simulação de drill (não abre no Looker real):\n' + (resumo || '(sem links)'));
    }
  }
};

// =======================================================================
// 2) Geradores de dados de exemplo
// =======================================================================

// Gerador pseudo-aleatório determinístico (para os testes serem repetíveis)
function criarRng(semente) {
  var s = semente;
  return function () {
    s = (s * 9301 + 49297) % 233280;
    return s / 233280;
  };
}

var PAISES = ['Brasil', 'Japão', 'Portugal', 'EUA', 'Alemanha'];
var PRODUTOS = ['Espresso', 'Latte', 'Cappuccino', 'Cold Brew', 'Mocha'];
var TRIMESTRES = ['Q1', 'Q2', 'Q3', 'Q4'];

function campoDimensao(nome, label) {
  return { name: nome, label: label, label_short: label, is_numeric: false };
}
function campoMedida(nome, label, formato) {
  return { name: nome, label: label, label_short: label, is_numeric: true, value_format: formato || '#,##0' };
}

function celula(valor, formatado, links) {
  if (valor === null || valor === undefined) return { value: null, rendered: null };
  return { value: valor, rendered: (formatado !== undefined ? formatado : String(valor)), links: links };
}

function gerarDadosSemPivo(n, comNulos) {
  var rng = criarRng(42);
  var queryResponse = {
    fields: {
      dimensions: [campoDimensao('pais', 'País'), campoDimensao('produto', 'Produto')],
      measures: [campoMedida('vendas', 'Vendas (R$)', '$#,##0.00'), campoMedida('quantidade', 'Quantidade')],
      table_calculations: [campoMedida('ticket_medio', 'Ticket Médio (table calc)', '$#,##0.00')],
      dimension_like: [campoDimensao('pais', 'País'), campoDimensao('produto', 'Produto')],
      measure_like: [
        campoMedida('vendas', 'Vendas (R$)', '$#,##0.00'),
        campoMedida('quantidade', 'Quantidade'),
        campoMedida('ticket_medio', 'Ticket Médio (table calc)', '$#,##0.00')
      ],
      pivots: []
    },
    pivots: []
  };

  var data = [];
  for (var i = 0; i < n; i++) {
    var pais = PAISES[i % PAISES.length];
    var produto = PRODUTOS[Math.floor(rng() * PRODUTOS.length)];
    var temNulo = comNulos && rng() < 0.08;
    var qtd = temNulo ? null : Math.floor(rng() * 500);
    var vendas = temNulo ? null : Math.round(qtd * (10 + rng() * 40) * 100) / 100;
    var ticket = (qtd && vendas) ? Math.round((vendas / qtd) * 100) / 100 : null;

    data.push({
      pais: celula(pais, pais, [{ label: 'Ver ' + pais, url: '#', type: 'measure_default' }]),
      produto: celula(produto, produto),
      vendas: celula(vendas, vendas === null ? null : 'R$ ' + vendas.toFixed(2)),
      quantidade: celula(qtd, qtd === null ? null : String(qtd)),
      ticket_medio: celula(ticket, ticket === null ? null : 'R$ ' + ticket.toFixed(2))
    });
  }
  return { data: data, queryResponse: queryResponse };
}

function gerarDadosComPivo(n, comNulos, comTotalDoLooker) {
  var rng = criarRng(7);
  var pivotField = campoDimensao('trimestre', 'Trimestre');

  var pivotsQR = TRIMESTRES.map(function (t) {
    return { key: t, is_total: false, data: { trimestre: t }, metadata: { trimestre: { value: t, rendered: t } } };
  });
  if (comTotalDoLooker) {
    pivotsQR.push({
      key: '$$$_row_total_$$$', is_total: true,
      data: { trimestre: null }, metadata: { trimestre: { value: null, rendered: 'Total' } }
    });
  }

  var queryResponse = {
    fields: {
      dimensions: [campoDimensao('pais', 'País'), campoDimensao('produto', 'Produto')],
      measures: [campoMedida('vendas', 'Vendas (R$)', '$#,##0.00'), campoMedida('quantidade', 'Quantidade')],
      table_calculations: [],
      dimension_like: [campoDimensao('pais', 'País'), campoDimensao('produto', 'Produto')],
      measure_like: [campoMedida('vendas', 'Vendas (R$)', '$#,##0.00'), campoMedida('quantidade', 'Quantidade')],
      pivots: [pivotField]
    },
    pivots: pivotsQR
  };

  var data = [];
  for (var i = 0; i < n; i++) {
    var pais = PAISES[i % PAISES.length];
    var produto = PRODUTOS[Math.floor(rng() * PRODUTOS.length)];

    var vendasPorTrimestre = {};
    var qtdPorTrimestre = {};
    var somaVendas = 0, somaQtd = 0, achouAlgumNaoNulo = false;

    TRIMESTRES.forEach(function (t) {
      var nulo = comNulos && rng() < 0.08;
      var qtd = nulo ? null : Math.floor(rng() * 200);
      var vendas = nulo ? null : Math.round(qtd * (10 + rng() * 40) * 100) / 100;
      if (!nulo) { somaVendas += vendas; somaQtd += qtd; achouAlgumNaoNulo = true; }
      vendasPorTrimestre[t] = celula(vendas, vendas === null ? null : 'R$ ' + vendas.toFixed(2));
      qtdPorTrimestre[t] = celula(qtd, qtd === null ? null : String(qtd));
    });

    if (comTotalDoLooker) {
      vendasPorTrimestre['$$$_row_total_$$$'] = celula(achouAlgumNaoNulo ? somaVendas : null, achouAlgumNaoNulo ? 'R$ ' + somaVendas.toFixed(2) : null);
      qtdPorTrimestre['$$$_row_total_$$$'] = celula(achouAlgumNaoNulo ? somaQtd : null, achouAlgumNaoNulo ? String(somaQtd) : null);
    }

    data.push({
      pais: celula(pais, pais),
      produto: celula(produto, produto),
      vendas: vendasPorTrimestre,
      quantidade: qtdPorTrimestre
    });
  }
  return { data: data, queryResponse: queryResponse };
}

function conjuntoVazio() {
  return {
    data: [],
    queryResponse: { fields: { dimensions: [], measures: [], table_calculations: [], dimension_like: [], measure_like: [], pivots: [] }, pivots: [] }
  };
}

// ---- Dados geográficos (para o Globo Terrestre Rotacionável) ----
var CIDADES = [
  ['São Paulo', -23.55, -46.63], ['Tóquio', 35.68, 139.69], ['Nova York', 40.71, -74.01],
  ['Londres', 51.51, -0.13], ['Sydney', -33.87, 151.21], ['Cairo', 30.04, 31.24],
  ['Moscou', 55.76, 37.62], ['Cidade do México', 19.43, -99.13], ['Lagos', 6.52, 3.38],
  ['Mumbai', 19.08, 72.88], ['Buenos Aires', -34.6, -58.38], ['Joanesburgo', -26.2, 28.05]
];

function gerarDadosGeoLocation(n) {
  var rng = criarRng(13);
  var qr = {
    fields: {
      dimensions: [campoDimensao('local', 'Localização')],
      measures: [campoMedida('pedidos', 'Pedidos')],
      table_calculations: [], dimension_like: [campoDimensao('local', 'Localização')],
      measure_like: [campoMedida('pedidos', 'Pedidos')], pivots: []
    },
    pivots: []
  };
  var data = [];
  for (var i = 0; i < n; i++) {
    var c = CIDADES[i % CIDADES.length];
    var lat = (c[1] + (rng() - 0.5) * 4).toFixed(2);
    var lon = (c[2] + (rng() - 0.5) * 4).toFixed(2);
    var valor = Math.floor(rng() * 1000);
    data.push({
      local: celula(lat + ',' + lon, c[0] + ' (' + lat + ', ' + lon + ')', [{ label: 'Ver ' + c[0], url: '#', type: 'measure_default' }]),
      pedidos: celula(valor, String(valor))
    });
  }
  return { data: data, queryResponse: qr };
}

function gerarDadosGeoManual(n) {
  var rng = criarRng(21);
  var qr = {
    fields: {
      dimensions: [campoDimensao('cidade', 'Cidade'), campoDimensao('latitude', 'Latitude'), campoDimensao('longitude', 'Longitude')],
      measures: [campoMedida('receita', 'Receita (R$)', '$#,##0.00')],
      table_calculations: [],
      dimension_like: [campoDimensao('cidade', 'Cidade'), campoDimensao('latitude', 'Latitude'), campoDimensao('longitude', 'Longitude')],
      measure_like: [campoMedida('receita', 'Receita (R$)', '$#,##0.00')], pivots: []
    },
    pivots: []
  };
  var data = [];
  for (var i = 0; i < n; i++) {
    var c = CIDADES[i % CIDADES.length];
    var lat = c[1] + (rng() - 0.5) * 4;
    var lon = c[2] + (rng() - 0.5) * 4;
    var valor = Math.round(rng() * 50000 * 100) / 100;
    data.push({
      cidade: celula(c[0]),
      latitude: celula(Math.round(lat * 100) / 100),
      longitude: celula(Math.round(lon * 100) / 100),
      receita: celula(valor, 'R$ ' + valor.toFixed(2))
    });
  }
  return { data: data, queryResponse: qr };
}

function gerarDadosGeoGrande(n) {
  var rng = criarRng(99);
  var qr = {
    fields: {
      dimensions: [campoDimensao('local', 'Localização')],
      measures: [campoMedida('valor', 'Valor')],
      table_calculations: [], dimension_like: [campoDimensao('local', 'Localização')],
      measure_like: [campoMedida('valor', 'Valor')], pivots: []
    },
    pivots: []
  };
  var data = [];
  for (var i = 0; i < n; i++) {
    var lat = (rng() * 170 - 85).toFixed(2);
    var lon = (rng() * 360 - 180).toFixed(2);
    data.push({ local: celula(lat + ',' + lon), valor: celula(Math.round(rng() * 100)) });
  }
  return { data: data, queryResponse: qr };
}

// ---- Dados para o Mapa Customizável ----
var CIDADES_MUNDO = [
  ['São Paulo', -23.5505, -46.6333], ['Rio de Janeiro', -22.9068, -43.1729], ['Brasília', -15.7939, -47.8828],
  ['Belo Horizonte', -19.9167, -43.9345], ['Manaus', -3.1190, -60.0217], ['Salvador', -12.9777, -38.5016],
  ['Tóquio', 35.6762, 139.6503], ['Nova York', 40.7128, -74.0060], ['Londres', 51.5074, -0.1278],
  ['Paris', 48.8566, 2.3522], ['Sydney', -33.8688, 151.2093], ['Cairo', 30.0444, 31.2357],
  ['Moscou', 55.7558, 37.6173], ['Cidade do México', 19.4326, -99.1332], ['Lagos', 6.5244, 3.3792],
  ['Mumbai', 19.0760, 72.8777], ['Buenos Aires', -34.6037, -58.3816], ['Joanesburgo', -26.2041, 28.0473],
  ['Toronto', 43.6532, -79.3832], ['Berlim', 52.5200, 13.4050], ['Jacarta', -6.2088, 106.8456],
  ['Seul', 37.5665, 126.9780], ['Bangkok', 13.7563, 100.5018], ['Istambul', 41.0082, 28.9784],
  ['Lima', -12.0464, -77.0428], ['Nairóbi', -1.2921, 36.8219], ['Manila', 14.5995, 120.9842],
  ['Dubai', 25.2048, 55.2708], ['Singapura', 1.3521, 103.8198], ['Madri', 40.4168, -3.7038]
];

function gerarMapaCidades30() {
  var qr = {
    fields: {
      dimension_like: [campoDimensao('cidade', 'Cidade'), campoDimensao('latitude', 'Latitude'), campoDimensao('longitude', 'Longitude')],
      measures: [campoMedida('populacao', 'População')], measure_like: [campoMedida('populacao', 'População')],
      table_calculations: [], dimensions: [campoDimensao('cidade', 'Cidade')], pivots: []
    },
    pivots: []
  };
  var data = CIDADES_MUNDO.map(function (c, i) {
    return {
      cidade: celula(c[0], c[0], [{ label: 'Ver ' + c[0], url: '#', type: 'measure_default' }]),
      latitude: celula(c[1]), longitude: celula(c[2]),
      populacao: celula(1000000 + i * 53000)
    };
  });
  return { data: data, queryResponse: qr };
}

function gerarMapaAleatorio(n, comNulos) {
  var rng = criarRng(55);
  var qr = {
    fields: {
      dimension_like: [campoDimensao('local', 'Localização')],
      measure_like: [campoMedida('valor', 'Valor')], measures: [campoMedida('valor', 'Valor')],
      table_calculations: [], dimensions: [campoDimensao('local', 'Localização')], pivots: []
    },
    pivots: []
  };
  var data = [];
  for (var i = 0; i < n; i++) {
    if (comNulos && rng() < 0.03) { data.push({ local: celula(null), valor: celula(null) }); continue; }
    var lat = (rng() * 170 - 85).toFixed(3);
    var lon = (rng() * 360 - 180).toFixed(3);
    data.push({ local: celula(lat + ',' + lon), valor: celula(Math.round(rng() * 1000)) });
  }
  return { data: data, queryResponse: qr };
}

function gerarMapaOrigemDestino(n) {
  var rng = criarRng(77);
  var qr = {
    fields: {
      dimension_like: [
        campoDimensao('origem_lat', 'Origem - Latitude'), campoDimensao('origem_lon', 'Origem - Longitude'),
        campoDimensao('destino_lat', 'Destino - Latitude'), campoDimensao('destino_lon', 'Destino - Longitude')
      ],
      measure_like: [campoMedida('viagens', 'Viagens')], measures: [campoMedida('viagens', 'Viagens')],
      table_calculations: [], dimensions: [], pivots: []
    },
    pivots: []
  };
  var data = [];
  for (var i = 0; i < n; i++) {
    var a = CIDADES_MUNDO[Math.floor(rng() * CIDADES_MUNDO.length)];
    var b = CIDADES_MUNDO[Math.floor(rng() * CIDADES_MUNDO.length)];
    data.push({
      origem_lat: celula(a[1]), origem_lon: celula(a[2]),
      destino_lat: celula(b[1]), destino_lon: celula(b[2]),
      viagens: celula(Math.round(rng() * 500))
    });
  }
  return { data: data, queryResponse: qr };
}

var GERADORES = {
  flat20: function () { return gerarDadosSemPivo(20, true); },
  flat5000: function () { return gerarDadosSemPivo(5000, true); },
  pivot20: function () { return gerarDadosComPivo(20, true, false); },
  pivot20total: function () { return gerarDadosComPivo(20, true, true); },
  pivot5000: function () { return gerarDadosComPivo(5000, false, false); },
  vazio: function () { return conjuntoVazio(); },
  geoLocation: function () { return gerarDadosGeoLocation(25); },
  geoManual: function () { return gerarDadosGeoManual(25); },
  geo2000: function () { return gerarDadosGeoGrande(2000); },
  mapaCidades30: function () { return gerarMapaCidades30(); },
  mapaAleatorio5000: function () { return gerarMapaAleatorio(5000, true); },
  mapaAleatorio20000: function () { return gerarMapaAleatorio(20000, false); },
  mapaOrigemDestino: function () { return gerarMapaOrigemDestino(200); }
};

// =======================================================================
// 3) Lista de arquivos de /src — ADICIONE UMA LINHA AQUI PARA CADA NOVA
//    VISUALIZAÇÃO CRIADA (o harness não lê o disco, então o include é manual)
//
//    O Mapa Customizável precisa das mesmas Dependencies do Admin do
//    Looker, carregadas NESTA ORDEM (ver cabeçalho de mapa_customizavel.js):
//    d3 -> d3-geo-projection -> topojson-client -> dados do mapa -> viz.
//    Isso roda para TODAS as visualizações no harness (não só o mapa);
//    para as outras, esses arquivos extras só ficam carregados sem uso.
// =======================================================================
var ARQUIVOS_SRC = [
  '../src/tabela_pivot_avancada.js',
  '../src/globo_terra_pontos.js',
  'https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js',
  'https://cdn.jsdelivr.net/npm/d3-geo-projection@4.0.0/dist/d3-geo-projection.min.js',
  'https://cdn.jsdelivr.net/npm/topojson-client@3.1.0/dist/topojson-client.min.js',
  '../src/world_topology_110m.js',
  '../src/mapa_customizavel.js'
];

function carregarScriptsSrc(callback) {
  var i = 0;
  function proximo() {
    if (i >= ARQUIVOS_SRC.length) { callback(); return; }
    var s = document.createElement('script');
    s.src = ARQUIVOS_SRC[i];
    s.onload = function () { i++; proximo(); };
    s.onerror = function () { console.error('Falha ao carregar', ARQUIVOS_SRC[i]); i++; proximo(); };
    document.head.appendChild(s);
  }
  proximo();
}

// =======================================================================
// 4) Orquestração do harness
// =======================================================================
var vizSelect = document.getElementById('vizSelect');
var dataSelect = document.getElementById('dataSelect');
var configArea = document.getElementById('configArea');
var vizContainer = document.getElementById('vizContainer');
var statusEl = document.getElementById('status');
var errosEl = document.getElementById('erros');

var instanciaAtual = null; // guarda a MESMA instância entre updates, como o Looker faz

function montarConfigPadrao(definicao) {
  var cfg = {};
  var opts = definicao.options || {};
  Object.keys(opts).forEach(function (chave) {
    cfg[chave] = opts[chave].default;
  });
  return cfg;
}

function popularSelectDeVisualizacoes() {
  vizSelect.innerHTML = '';
  Object.keys(registroDeVisualizacoes).forEach(function (id) {
    var def = registroDeVisualizacoes[id];
    var opt = document.createElement('option');
    opt.value = id;
    opt.textContent = def.label + ' (' + id + ')';
    vizSelect.appendChild(opt);
  });
}

function anexarMetodosDeInstancia(definicao) {
  // Simula os métodos que o runtime do Looker injeta na instância da
  // visualização, além de create/updateAsync.
  definicao.addError = function (erro) {
    var msg = (erro && (erro.title ? erro.title + ': ' : '') + (erro.message || '')) || JSON.stringify(erro);
    errosEl.textContent += '[addError] ' + msg + '\n';
  };
  definicao.clearErrors = function () {
    errosEl.textContent = '';
  };
  definicao.trigger = function (evento, args) {
    console.log('[harness] trigger', evento, args);
    if (evento === 'registerOptions' && args) {
      // IMPORTANTE: testado no Looker real — registerOptions SUBSTITUI o
      // painel de opções inteiro pelo que for passado (não mescla com o
      // que já existia). Simulamos isso aqui de propósito, mesmo que
      // pareça "destrutivo", para pegar esse bug no harness em vez de só
      // descobrir depois de publicar no Looker.
      definicao.options = args;
    }
  };
  return definicao;
}

function renderizar() {
  var vizId = vizSelect.value;
  var definicao = registroDeVisualizacoes[vizId];
  if (!definicao) { return; }

  errosEl.textContent = '';
  var geradorKey = dataSelect.value;
  var conjunto = GERADORES[geradorKey]();

  var config;
  try {
    config = JSON.parse(configArea.value || '{}');
  } catch (e) {
    statusEl.textContent = 'Config inválida (JSON): ' + e.message;
    return;
  }

  // Recria o container e a instância a cada troca de visualização/dados,
  // para simular uma nova carga de tile (evita estado residual entre testes).
  vizContainer.innerHTML = '';
  instanciaAtual = anexarMetodosDeInstancia(Object.create(definicao));
  // copia create/updateAsync/options para a instância (Object.create já dá
  // acesso via protótipo, mas deixamos explícito para clareza)

  try {
    instanciaAtual.create(vizContainer, config);
  } catch (e) {
    errosEl.textContent += '[create] ' + e.message + '\n';
    return;
  }

  var t0 = performance.now();
  try {
    instanciaAtual.updateAsync(conjunto.data, vizContainer, config, conjunto.queryResponse, {}, function () {
      var t1 = performance.now();
      statusEl.textContent = 'OK — ' + conjunto.data.length + ' linhas, updateAsync levou ' + (t1 - t0).toFixed(1) + ' ms';
    });
  } catch (e) {
    errosEl.textContent += '[updateAsync] ' + e.message + '\n';
  }
}

document.getElementById('btnRenderizar').addEventListener('click', renderizar);
document.getElementById('btnOpcoesPadrao').addEventListener('click', function () {
  // Mescla no JSON atual as chaves de opções que ainda não existem nele —
  // útil depois que a visualização chama this.trigger('registerOptions', ...)
  // com seletores de campo que só existem depois da 1ª consulta (ex.: o
  // Globo registra "campoLocalizacao", "campoLatitude" etc. dinamicamente).
  var def = registroDeVisualizacoes[vizSelect.value];
  if (!def) return;
  var atual = {};
  try { atual = JSON.parse(configArea.value || '{}'); } catch (e) { /* ignora JSON inválido, começa do zero */ }
  Object.keys(def.options || {}).forEach(function (chave) {
    if (!(chave in atual)) atual[chave] = def.options[chave].default;
  });
  configArea.value = JSON.stringify(atual, null, 2);
});
vizSelect.addEventListener('change', function () {
  var def = registroDeVisualizacoes[vizSelect.value];
  configArea.value = JSON.stringify(montarConfigPadrao(def), null, 2);
});

// ---- Presets rápidos do Mapa Customizável ----
var PRESETS_MAPA = {
  mercator: { projection: 'mercator', mapStyle: 'custom' },
  orthographic: { projection: 'orthographic', mapStyle: 'custom' },
  kavrayskiy7: { projection: 'kavrayskiy7', mapStyle: 'custom' },
  albersUsa: { projection: 'albersUsa', mapStyle: 'custom' },
  identity: { projection: 'identity', mapStyle: 'custom' },
  dark: { mapStyle: 'dark' },
  satellite: { mapStyle: 'satellite' },
  customBrasil: { mapPosition: 'custom', customCenterLon: -51, customCenterLat: -14, customZoom: 4 },
  semPanZoom: { allowPanning: false, allowZooming: false },
  tooltipCustom: { customTooltip: true, customTooltipTemplate: '{{cidade}}: {{populacao}} hab.\n{{latitude}}, {{longitude}}' },
  modoGlobo: { mapMode: 'globe', startCenteredOnData: true, autoRotate: false }
};
document.querySelectorAll('#presetsMapa button[data-preset]').forEach(function (btn) {
  btn.addEventListener('click', function () {
    var def = registroDeVisualizacoes[vizSelect.value];
    if (!def) return;
    var atual = {};
    try { atual = JSON.parse(configArea.value || '{}'); } catch (e) { atual = montarConfigPadrao(def); }
    Object.assign(atual, PRESETS_MAPA[btn.getAttribute('data-preset')]);
    configArea.value = JSON.stringify(atual, null, 2);
    renderizar();
  });
});

carregarScriptsSrc(function () {
  popularSelectDeVisualizacoes();
  if (vizSelect.options.length > 0) {
    vizSelect.selectedIndex = 0;
    configArea.value = JSON.stringify(montarConfigPadrao(registroDeVisualizacoes[vizSelect.value]), null, 2);
    renderizar();
  } else {
    statusEl.textContent = 'Nenhuma visualização carregada — confira ARQUIVOS_SRC no harness.';
  }
});
</script>
